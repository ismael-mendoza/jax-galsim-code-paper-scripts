[project]
name = "jax-galsim-code-paper-scripts"
version = "0.1.0"
description = "Scripts for reproducing the figures and results of the JAX-GalSim code paper."
readme = "README.md"
authors = [{ name = "ismael-mendoza", email = "11745764+ismael-mendoza@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "jax-galsim",
    "jax",
    "galsim>=2.7.0",
    "numpy",
    "astropy",
    "surveycodex",
    "matplotlib",
    "tqdm",
    "typer",
    "ipython",
    "jupyter",
    "xprof",
]

[project.optional-dependencies]
# GPU runs (sbatch/gpu-master.sbatch): `uv run --extra cuda ...`
cuda = ["jax[cuda12]"]

# JAX-GalSim checked out next to this repo (locally and on the cluster).
[tool.uv.sources]
jax-galsim = { path = "../JAX-GalSim", editable = true }

# Shared modules in src/ are installed (editable) into the environment, so
# `from draw_scene_functions import ...`, `from fig2_scene import ...` and
# `from metacal_common import ...` work from any script, in any folder.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules  = ["draw_scene_functions", "fig2_scene", "metacal_common"]

[build-system]
requires      = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
